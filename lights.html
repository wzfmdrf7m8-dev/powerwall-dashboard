<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lights</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f5f7">
<style>
:root{--bg:#f5f5f7;--card:#ffffff;--edge:rgba(0,0,0,.05);--txt:#1d1d1f;--dim:#6e6e73;
  --mint:#34c759;--sun:#ff9500;--cyan:#007aff;--pink:#ff3b30;--violet:#af52de}
*{box-sizing:border-box;margin:0}
body{color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  padding:24px 20px;max-width:1150px;margin:auto;background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
h1{font-size:26px;letter-spacing:-.022em;font-weight:700}
.sub{color:var(--dim);font-size:13px}
header{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
header .spacer{flex:1}
.card{background:var(--card);border:1px solid var(--edge);border-radius:18px;padding:18px;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);margin-bottom:16px}
nav.pages{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
nav.pages a{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--edge);
  text-decoration:none;color:var(--txt);font-size:13px}
nav.pages a.on{background:var(--txt);color:#fff}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.room h2{font-size:17px;font-weight:650;letter-spacing:-.01em}
.roomhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.roomhead .spacer{flex:1}
.count{color:var(--dim);font-size:12px}
.sw{position:relative;width:50px;height:30px;border-radius:999px;border:1px solid var(--edge);
  background:#e9e9eb;cursor:pointer;transition:background .18s;flex:none}
.sw.on{background:var(--mint)}
.sw i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.sw.on i{transform:translateX(20px)}
.sw.busy{opacity:.45;pointer-events:none}
.light{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--edge)}
.light .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.light.off .nm{color:var(--dim)}
.light.dead .nm{color:var(--dim);text-decoration:line-through}
.sw.sm{width:42px;height:25px}
.sw.sm i{width:19px;height:19px}
.sw.sm.on i{transform:translateX(17px)}
input[type=range]{width:110px;accent-color:var(--sun)}
.scenes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.scene{padding:5px 10px;border-radius:999px;border:1px solid var(--edge);background:var(--bg);
  font-size:12px;cursor:pointer}
.scene:active{background:var(--txt);color:#fff}
.badge{font-size:10px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:999px;
  background:var(--bg);color:var(--dim);border:1px solid var(--edge)}
.banner{background:#fff4e5;border:1px solid #ffd8a8;color:#7a4a00;border-radius:12px;padding:10px 14px;
  font-size:13px;margin-bottom:14px}
.err{background:#ffe9e7;border-color:#ffc4bd;color:#8a1c10}
button.plain.armed{background:var(--violet);color:#fff;border-color:var(--violet)}
button.plain{font:inherit;padding:7px 14px;border-radius:999px;border:1px solid var(--edge);
  background:var(--card);cursor:pointer}
</style>
</head>
<body>
<nav class="pages">
  <a href="./">⚡ Energy</a><a href="heating">🌡 Heating</a><a href="heatpump">♨️ Heat pump</a><a href="network">📶 Network</a><a href="octopus">🐙 Octopus</a><a href="oura">💍 Oura</a><a href="health">🔋 Battery</a><a href="ledger">📒 Ledger</a><a class="on" href="lights">💡 Lights</a><a href="ovens">🔥 Ovens</a>
</nav>

<header>
  <div>
    <h1>Lights</h1>
    <div class="sub" id="sub">loading…</div>
  </div>
  <div class="spacer"></div>
  <button class="plain" id="holidayBtn">Holiday mode</button>
  <button class="plain" id="allOff">All off</button>
</header>

<div id="warn"></div>
<div class="rooms" id="rooms"></div>

<script>
const API = 'https://powerwall-api.randlefamily.com';
const el = (id) => document.getElementById(id);
let PASS = localStorage.getItem('pw_pass') || '';
let STATE = null;
// commands are optimistic: the agent needs a few seconds, so we show the new
// position immediately and let the next poll confirm or correct it
const pending = new Map();

async function decrypt(buf) {
  const bin = atob(buf.trim());
  const b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(PASS), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b.slice(0, 16), iterations: 200000, hash: 'SHA-256' },
    km, { name: 'AES-CBC', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: b.slice(16, 32) }, key, b.slice(32));
  return JSON.parse(new TextDecoder().decode(pt));
}

async function send(cmd) {
  const r = await fetch(API + '/cmd', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-auth': PASS },
    body: JSON.stringify({ command: 'light', value: JSON.stringify(cmd) })
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function ago(ts) {
  if (!ts) return 'never';
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 90) return s + 's ago';
  if (s < 5400) return Math.round(s / 60) + 'm ago';
  return Math.round(s / 3600) + 'h ago';
}

function toggle(kind, id, on, node, hub) {
  hub = hub || 'hue';
  const key = hub + ':' + kind + ':' + id;
  node.classList.add('busy');
  pending.set(key, { on, at: Date.now() });
  node.classList.toggle('on', on);
  send({ hub, target: kind, id, on })
    .then(() => setTimeout(load, 2500))
    .catch((e) => {
      node.classList.remove('busy');
      pending.delete(key);
      warn('could not queue that: ' + e.message, true);
    });
}

function dim(kind, id, bri, hub) {
  send({ hub: hub || 'hue', target: kind, id, bri })
    .then(() => setTimeout(load, 2500)).catch(() => {});
}

// IKEA has no group endpoint, so a room switch is just every bulb in the room
async function iroom(room, on, node) {
  node.classList.add('busy');
  pending.set('ikea:room:' + room, { on, at: Date.now() });
  node.classList.toggle('on', on);
  const ids = (window.__IKROOMS || {})[room] || [];
  for (const id of ids) {
    pending.set('ikea:light:' + id, { on, at: Date.now() });
    try { await send({ hub: 'ikea', target: 'light', id, on }); } catch (e) {}
  }
  setTimeout(load, 2500);
}

function warn(msg, bad) {
  el('warn').innerHTML = msg ? '<div class="banner' + (bad ? ' err' : '') + '">' + msg + '</div>' : '';
}

function render(h) {
  const li = h.lights;
  if (!li) { warn('No light data yet. Is the NAS agent running?', true); return; }
  const hue = li.hue || { lights: {}, groups: {}, scenes: {} };
  const L = hue.lights || {}, G = hue.groups || {}, S = hue.scenes || {};
  const IK = li.ikea || {};

  const all = Object.values(L).concat(Object.values(IK));
  const nOn = all.filter((x) => x.on).length;
  const nDead = all.filter((x) => x.reachable === false).length;
  el('sub').textContent = all.length + ' lights · ' + nOn + ' on'
    + (nDead ? ' · ' + nDead + ' unreachable' : '') + ' · updated ' + ago(li.t);

  renderHoliday(li.holiday);

  const msgs = [];
  if (li.ikea_error) msgs.push('IKEA hub: ' + li.ikea_error);
  if (!li.ikea && !li.ikea_error) msgs.push('IKEA hub not reporting.');
  // Measure the agent against the bundle, not against the clock. The worker
  // only rebuilds /home every minute or two, so a perfectly healthy agent is
  // always a bundle-latency behind and a wall-clock test cries wolf.
  // generated_at carries no zone and is written in local time, so let the
  // browser parse it as local - appending Z would shift it an hour in BST and
  // the check would silently never fire.
  const bundleT = Date.parse(h.generated_at) / 1000 || Date.now() / 1000;
  if (li.t && bundleT - li.t > 300) msgs.push('Light data is stale — the NAS agent may have stopped.');
  warn(msgs.join(' · '), msgs.length > 0);

  // rooms first, then anything the bridge does not place in a room
  const rooms = Object.entries(G)
    .filter(([, g]) => g.type === 'Room' && (g.lights || []).length)
    .sort((a, b) => (b[1].lights || []).length - (a[1].lights || []).length);
  const placed = new Set();
  rooms.forEach(([, g]) => (g.lights || []).forEach((x) => placed.add(String(x))));
  const orphans = Object.keys(L).filter((id) => !placed.has(String(id)));

  // hub matters twice over: IKEA dims 1-100 where Hue dims 1-254, and the
  // agent needs to be told which bridge a command is for
  const lightRow = (id, hub) => {
    const l = (hub === 'ikea' ? IK : L)[id]; if (!l) return '';
    const dead = l.reachable === false;
    const key = hub + ':light:' + id;
    const on = pending.has(key) ? pending.get(key).on : !!l.on;
    const max = hub === 'ikea' ? 100 : 254;
    return '<div class="light' + (on ? '' : ' off') + (dead ? ' dead' : '') + '">'
      + '<div class="nm">' + esc(l.name || ('#' + id)) + '</div>'
      + (on && l.bri != null && !dead
          ? '<input type="range" min="1" max="' + max + '" value="' + Math.min(l.bri, max)
            + '" data-bri="' + id + '" data-hub="' + hub + '">' : '')
      + '<div class="sw sm' + (on ? ' on' : '') + '" data-light="' + id + '" data-hub="' + hub
      + '" data-on="' + (on ? 1 : 0) + '"'
      + (dead ? ' title="unreachable"' : '') + '><i></i></div></div>';
  };

  let html = '';
  for (const [gid, g] of rooms) {
    const ids = (g.lights || []).map(String);
    const anyOn = pending.has('hue:group:' + gid) ? pending.get('hue:group:' + gid).on : !!g.any_on;
    const scenes = Object.entries(S).filter(([, s]) => String(s.group) === String(gid)).slice(0, 6);
    html += '<div class="card room"><div class="roomhead">'
      + '<h2>' + esc(g.name) + '</h2><span class="badge">HUE</span><div class="spacer"></div>'
      + '<span class="count">' + ids.filter((i) => L[i] && L[i].on).length + '/' + ids.length + '</span>'
      + '<div class="sw' + (anyOn ? ' on' : '') + '" data-group="' + gid + '" data-on="' + (anyOn ? 1 : 0) + '"><i></i></div>'
      + '</div>'
      + ids.map((i) => lightRow(i, 'hue')).join('')
      + (scenes.length ? '<div class="scenes">' + scenes.map(([sid, s]) =>
          '<span class="scene" data-scene="' + sid + '" data-group="' + gid + '">' + esc(s.name) + '</span>').join('') + '</div>' : '')
      + '</div>';
  }
  if (orphans.length) {
    html += '<div class="card room"><div class="roomhead"><h2>Not in a room</h2>'
      + '<span class="badge">HUE</span>'
      + '<div class="spacer"></div><span class="count">' + orphans.length + '</span></div>'
      + orphans.map((i) => lightRow(i, 'hue')).join('') + '</div>';
  }

  // IKEA: the hub exposes devices with a room name but no group or scene
  // objects, so rooms are assembled here and a room switch just fans out to
  // each bulb in it.
  const ikRooms = {};
  Object.keys(IK).forEach((id) => {
    const r = IK[id].room || 'Not in a room';
    (ikRooms[r] = ikRooms[r] || []).push(id);
  });
  Object.keys(ikRooms).sort((a, b) => ikRooms[b].length - ikRooms[a].length).forEach((r) => {
    const ids = ikRooms[r];
    const live = ids.filter((i) => IK[i].on).length;
    const pk = 'ikea:room:' + r;
    const anyOn = pending.has(pk) ? pending.get(pk).on : live > 0;
    html += '<div class="card room"><div class="roomhead">'
      + '<h2>' + esc(r) + '</h2><span class="badge">IKEA</span><div class="spacer"></div>'
      + '<span class="count">' + live + '/' + ids.length + '</span>'
      + '<div class="sw' + (anyOn ? ' on' : '') + '" data-iroom="' + esc(r) + '" data-on="'
      + (anyOn ? 1 : 0) + '"><i></i></div></div>'
      + ids.map((i) => lightRow(i, 'ikea')).join('')
      + '</div>';
  });

  el('rooms').innerHTML = html;
  window.__IKROOMS = ikRooms;
  wire();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function wire() {
  document.querySelectorAll('[data-light]').forEach((n) =>
    n.onclick = () => toggle('light', n.dataset.light, n.dataset.on !== '1', n, n.dataset.hub));
  document.querySelectorAll('[data-group]').forEach((n) => {
    if (n.dataset.scene) return;
    n.onclick = () => toggle('group', n.dataset.group, n.dataset.on !== '1', n, 'hue');
  });
  document.querySelectorAll('[data-iroom]').forEach((n) => {
    n.onclick = () => iroom(n.dataset.iroom, n.dataset.on !== '1', n);
  });
  document.querySelectorAll('[data-bri]').forEach((n) => {
    n.onchange = () => dim('light', n.dataset.bri, +n.value, n.dataset.hub);
  });
  document.querySelectorAll('[data-scene]').forEach((n) => {
    n.onclick = () => {
      send({ target: 'group', id: n.dataset.group, scene: n.dataset.scene })
        .then(() => setTimeout(load, 2500)).catch(() => {});
    };
  });
}

// Holiday mode is owned by the NAS agent, not this page: it has to keep running
// long after the tab is closed. The page only flips the flag and reports back
// whatever the agent says it is doing.
function renderHoliday(h) {
  const b = el('holidayBtn');
  if (!h) { b.textContent = 'Holiday mode'; b.classList.remove('armed'); return; }
  b.classList.toggle('armed', !!h.on);
  if (!h.on) {
    b.textContent = 'Holiday mode';
    b.title = 'Simulate someone being home after dark';
    return;
  }
  const bed = h.bedtime ? new Date(h.bedtime * 1000)
        .toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : null;
  b.textContent = 'Holiday: ' + (h.room || h.why || 'on');
  b.title = 'Lights follow a plausible pattern after dark'
    + (bed ? ', all off around ' + bed : '')
    + (h.lit && h.lit.length ? '. Lit now: ' + h.lit.join(', ') : '');
}

el('holidayBtn').onclick = async () => {
  const cur = !!((((STATE || {}).lights) || {}).holiday || {}).on;
  const b = el('holidayBtn');
  b.disabled = true;
  try {
    await send({ target: 'holiday', on: !cur });
    warn(cur ? 'Holiday mode off. Anything it switched on goes off shortly.'
             : 'Holiday mode on. Nothing happens until dusk.', false);
  } catch (e) {
    warn('Could not change holiday mode: ' + e.message, true);
  }
  b.disabled = false;
  setTimeout(load, 2500);
};

el('allOff').onclick = async () => {
  const li = (STATE && STATE.lights) || {};
  const G = ((li.hue || {}).groups) || {};
  for (const [gid, g] of Object.entries(G)) {
    if (g.type === 'Room' && (g.lights || []).length) {
      try { await send({ hub: 'hue', target: 'group', id: gid, on: false }); } catch (e) {}
    }
  }
  for (const id of Object.keys(li.ikea || {})) {
    try { await send({ hub: 'ikea', target: 'light', id, on: false }); } catch (e) {}
  }
  setTimeout(load, 2500);
};

async function load() {
  try {
    const txt = await (await fetch(API + '/home', { cache: 'no-store' })).text();
    STATE = await decrypt(txt);
    // clear optimistic marks older than 15s so a failed command cannot stick
    for (const [k, v] of pending) if (Date.now() - v.at > 15000) pending.delete(k);
    render(STATE);
  } catch (e) {
    if (!PASS) {
      PASS = prompt('Dashboard password') || '';
      if (PASS) { localStorage.setItem('pw_pass', PASS); return load(); }
    }
    el('sub').textContent = 'could not load: ' + e.message;
  }
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
